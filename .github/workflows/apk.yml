name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  DSH_MAVEN_MIRRORS: 0

jobs:
  build-apk:
    name: Complete Arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test APK runtime checks
        run: python3 -m unittest discover -s tooling -p 'test_check_apk_runtime.py' -v

      - name: Test companion pack checks
        run: python3 -m unittest discover -s tooling -p 'test_companion_pack.py' -v

      - name: Test fixed signing configuration
        run: python3 -m unittest discover -s tooling -p 'test_configure_android_signing.py' -v

      - name: Place verified built-in companion pack
        run: |
          # Use only the licensed companion pack already shipped with this official APK.
          source_apk="$RUNNER_TEMP/dsh-go-1.3.0-arm64.apk"
          curl --disable --fail --silent --show-error --location --max-time 240 \
            https://github.com/ccch1mneyyy/dsh-Go/releases/download/v1.3.0/dsh-go-1.3.0-arm64.apk \
            --output "$source_apk"
          python3 -I tooling/companion_pack.py place-release "$source_apk"

      - name: Restore runtime downloads
        id: runtime-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: runtime-downloads-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-v1-

      - name: Build bundled Ubuntu and DSH runtime
        run: bash runtime/build-runtime.sh arm64-v8a

      - name: Verify runtime bundle
        run: python3 -I tooling/check_runtime_bundle.py arm64

      - name: Save runtime downloads
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure fixed release signing
        env:
          DSH_ANDROID_KEYSTORE_BASE64: ${{ secrets.DSH_ANDROID_KEYSTORE_BASE64 }}
          DSH_ANDROID_KEY_ALIAS: ${{ secrets.DSH_ANDROID_KEY_ALIAS }}
          DSH_ANDROID_STORE_PASSWORD: ${{ secrets.DSH_ANDROID_STORE_PASSWORD }}
          DSH_ANDROID_KEY_PASSWORD: ${{ secrets.DSH_ANDROID_KEY_PASSWORD }}
        run: python3 -I tooling/configure_android_signing.py --decode-to "$RUNNER_TEMP/dsh-go-release.p12"

      - name: Build bundled tawcroot launcher
        run: |
          android_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          test -x "$android_tools/sdkmanager"
          test -x "$android_tools/apkanalyzer"
          echo "$android_tools" >> "$GITHUB_PATH"
          "$android_tools/sdkmanager" 'ndk;28.2.13676358'
          python3 -I runtime/tawcroot/build.py --ndk "$ANDROID_HOME/ndk/28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies and stamp version
        run: |
          (cd app && flutter pub get --enforce-lockfile)
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' app/pubspec.yaml)
          code=$(python3 tooling/build_number.py)
          printf 'sdk.dir=%s\nflutter.sdk=%s\nflutter.versionName=%s\nflutter.versionCode=%s\n' \
            "$ANDROID_HOME" "$FLUTTER_ROOT" "$version" "$code" > app/android/local.properties
          defines=$(printf 'DSH_APP_VERSION=%s+%s' "$version" "$code" | base64 -w 0)
          printf 'APK_VERSION=%s\nAPK_CODE=%s\nAPK_DART_DEFINES=%s\n' "$version" "$code" "$defines" >> "$GITHUB_ENV"

      - name: Install widget test fonts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk fonts-noto-cjk-extra

      - name: Test chat dock rendering
        working-directory: app
        env:
          DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
          DSH_DOCK_PREVIEW_DIR: ${{ runner.temp }}/dock-previews
        run: >-
          flutter test --no-pub
          test/chat/dock/dock_stack_test.dart
          test/chat/dock/dock_backdrop_test.dart
          test/landscape/landscape_geometry_test.dart

      - name: Test update sources
        working-directory: app
        env:
          DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
        run: flutter test --no-pub test/update

      - name: Upload dock rendering previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dock-rendering-previews
          path: ${{ runner.temp }}/dock-previews/
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Assemble Arm64 release APK
        working-directory: app/android
        run: gradle --stacktrace -Ptarget-platform=android-arm64 "-Pdart-defines=$APK_DART_DEFINES" :app:assembleArm64Release

      - name: Verify packaged runtime, launcher, JNI and companion pack
        run: |
          set -x
          apk=app/build/app/outputs/apk/arm64/release/app-arm64-release.apk
          apkanalyzer=$(command -v apkanalyzer)
          "$apkanalyzer" manifest print "$apk" > "$RUNNER_TEMP/apk-manifest.xml"
          package=$("$apkanalyzer" manifest application-id "$apk")
          name=$("$apkanalyzer" manifest version-name "$apk")
          code=$("$apkanalyzer" manifest version-code "$apk")
          printf 'package=%s name=%s code=%s\n' "$package" "$name" "$code"
          test "$package" = io.github.ccch1mneyyy.dsh_app_next
          test "$name" = "$APK_VERSION"
          test "$code" = "$APK_CODE"
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          # AGP 9 no longer writes a v1 JAR signature; minSdk 26 means v2/v3 is
          # what Android checks. Verifying at 21 would demand v1 and fail.
          "$apksigner" verify --verbose --min-sdk-version 26 --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signature.txt"
          expected=$(tr -d '\r\n' < app/android/release-certificate.sha256 | tr 'A-F' 'a-f')
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | tr -d '\r\n' | tr 'A-F' 'a-f')
          printf 'expected=%s\nactual=%s\n' "$expected" "$actual"
          test -n "$actual"
          test "$actual" = "$expected"
          python3 tooling/check_apk_runtime.py "$apk" --manifest "$RUNNER_TEMP/apk-manifest.xml"
          python3 -I tooling/check_apk_jni.py "$apk"
          python3 -I tooling/companion_pack.py check-release "$apk"
          mkdir -p dist
          cp "$apk" dist/dsh-go-next-arm64.apk
          (cd dist && sha256sum dsh-go-next-arm64.apk > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload complete APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-next-arm64
          path: dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
