name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  DSH_MAVEN_MIRRORS: 0

jobs:
  build-apk:
    name: Arm64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Assemble Arm64 debug APK
        working-directory: app/android
        run: gradle --stacktrace -Ptarget-platform=android-arm64 :app:assembleArm64Debug

      - name: Verify APK package and launcher
        shell: bash
        run: |
          apk=app/build/app/outputs/apk/arm64/debug/app-arm64-debug.apk
          test -s "$apk"
          aapt=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -n 1)
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='io.github.ccch1mneyyy.dsh_app_next'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "launchable-activity: name='io.github.ccch1mneyyy.dsh_app.LauncherMist'" "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-next-arm64-debug
          path: app/build/app/outputs/apk/arm64/debug/app-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14
